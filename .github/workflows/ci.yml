name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The organizers' dataset is fetched, never committed (see README).
      - name: Fetch sample dataset
        run: scripts/fetch_data.sh
      # The app (agent, server) targets Python 3.12. On 3.9 only the data layer is checked and the app tests skip.
      - name: Install app dependencies
        if: matrix.python-version != '3.9'
        run: pip install -r requirements.txt httpx
      - name: Unit, integration, agent, server and e2e-harness tests (no model calls)
        run: python3 -m unittest discover -s tests -t . -v
      # The live end-to-end run makes billed model calls, so it is manual, not part of CI:
      #   ANTHROPIC_API_KEY=... COPILOT_ADAPTER=tests.e2e.adapter:ask python3 -m unittest tests.e2e.test_copilot -v
