name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The organizers' dataset is fetched, never committed (see README).
      - name: Fetch sample dataset
        run: scripts/fetch_data.sh
      # The app (agent, server) targets Python 3.12. On 3.9 only the data layer is checked and the app tests skip.
      - name: Install app dependencies
        if: matrix.python-version != '3.9'
        run: pip install -r requirements.txt httpx markdown
      - name: Tests (data layer only)
        if: matrix.python-version == '3.9'
        run: python3 -m unittest discover -s tests -t . -v
      # Runs the same suite and writes the HTML report (site/) that is published to GitHub Pages. No model calls.
      - name: Tests and report
        if: matrix.python-version != '3.9'
        run: python3 scripts/test_report.py --out site
      - name: Upload report
        if: ${{ !cancelled() && matrix.python-version != '3.9' && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # The live end-to-end run makes real model calls, so it is manual, not part of CI:
      #   COPILOT_ADAPTER=tests.e2e.adapter:ask python3 -m unittest tests.e2e.test_copilot -v

  # Publish the report to GitHub Pages on every push to main, including when tests fail (so failures are visible).
  # One-time setup: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
  deploy:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
