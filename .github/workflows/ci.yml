name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The organizers' dataset is fetched, never committed (see README).
      - name: Fetch sample dataset
        run: scripts/fetch_data.sh
      - name: Unit, integration and e2e-harness tests
        run: python3 -m unittest discover -s tests -t . -v
      # Enable once the app has a start command and a free model key is stored as a repo secret:
      #   COPILOT_URL=http://localhost:8000 python3 -m unittest tests.e2e.test_copilot -v
